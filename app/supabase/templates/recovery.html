<h2>Reset your Web3Rails password</h2>
<p>Someone asked to reset the password of {{ .Email }}. If it was you, open this link and choose a new password:</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Choose a new password</a></p>
<p>The link works once and expires in one hour. If you did not ask for this, ignore this email: your password stays the same.</p>
